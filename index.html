<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wallpaper</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 390px;
    height: 844px;
    overflow: hidden;
    background: #f0ede6;
    font-family: 'DM Sans', sans-serif;
    position: relative;
  }

  /* Subtle noise texture overlay */
  body::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
    opacity: 0.35;
    pointer-events: none;
    z-index: 10;
  }

  /* Pale sage accent blobs */
  .blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(60px);
    opacity: 0.45;
  }
  .blob-1 {
    width: 280px; height: 280px;
    background: #c5d9c2;
    top: -60px; right: -80px;
  }
  .blob-2 {
    width: 220px; height: 220px;
    background: #dde8d0;
    bottom: 80px; left: -60px;
  }
  .blob-3 {
    width: 160px; height: 160px;
    background: #e8e0d4;
    top: 360px; right: 20px;
  }

  .container {
    position: relative;
    z-index: 2;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    padding: 64px 36px 52px;
  }

  /* Top eyebrow */
  .eyebrow {
    font-family: 'DM Sans', sans-serif;
    font-weight: 300;
    font-size: 10px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: #7a8c72;
    margin-bottom: 40px;
  }

  /* Main headline block */
  .headline-block {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 0;
  }

  .line {
    display: block;
    line-height: 1.08;
    color: #2c3329;
  }

  .line-serif {
    font-family: 'DM Serif Display', serif;
    font-size: 46px;
  }
  .line-serif-italic {
    font-family: 'DM Serif Display', serif;
    font-style: italic;
    font-size: 46px;
    color: #5a7a52;
  }

  .divider {
    width: 32px;
    height: 1.5px;
    background: #aab89e;
    margin: 22px 0;
  }

  /* Question cards */
  .questions {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-top: 4px;
  }

  .q-card {
    background: rgba(255,255,255,0.52);
    border: 1px solid rgba(255,255,255,0.8);
    border-radius: 12px;
    padding: 12px 16px;
    backdrop-filter: blur(4px);
  }

  .q-text {
    font-size: 12.5px;
    font-weight: 300;
    color: #3d4a38;
    line-height: 1.5;
    letter-spacing: 0.01em;
  }

  .q-text em {
    font-style: normal;
    font-weight: 400;
    color: #5a7a52;
  }

  /* Bottom statement */
  .bottom {
    margin-top: 28px;
  }

  .bottom-rule {
    width: 100%;
    height: 1px;
    background: linear-gradient(90deg, #aab89e 0%, transparent 100%);
    margin-bottom: 18px;
  }

  .bottom-text {
    font-size: 10.5px;
    font-weight: 300;
    color: #7a8c72;
    letter-spacing: 0.06em;
    line-height: 1.7;
    text-transform: uppercase;
  }

  .bottom-text strong {
    font-weight: 400;
    color: #3d4a38;
  }
</style>
</head>
<body>

<div class="blob blob-1"></div>
<div class="blob blob-2"></div>
<div class="blob blob-3"></div>

<div class="container">

  <div class="eyebrow">A reminder · every single day</div>

  <div class="headline-block">

    <span class="line line-serif">Put it</span>
    <span class="line line-serif-italic">down.</span>

    <div class="divider"></div>

    <div class="questions">
      <div class="q-card">
        <p class="q-text">Was that <em>30 minutes</em> really worth it?</p>
      </div>
      <div class="q-card">
        <p class="q-text">You came here to scroll — or to <em>live?</em></p>
      </div>
      <div class="q-card">
        <p class="q-text">The reel ends. <em>Your time doesn't come back.</em></p>
      </div>
      <div class="q-card">
        <p class="q-text">What if you spent the next hour on <em>something real?</em></p>
      </div>
      <div class="q-card">
        <p class="q-text">Close the app. <em>Open your life.</em></p>
      </div>
    </div>

  </div>

  <div class="bottom">
    <div class="bottom-rule"></div>
    <p class="bottom-text">
      Attention is <strong>finite</strong> &nbsp;·&nbsp; spend it <strong>wisely</strong>
    </p>
  </div>

</div>

</body>
</html>
